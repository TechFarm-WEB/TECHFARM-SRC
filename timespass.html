<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic 3D/8D Live Flower Bouquet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Premium Dark Orchid Background for Contrast */
            background: radial-gradient(circle at center, #23083b 0%, #06010d 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* 8D Audio Button Styling */
        .audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 12px 26px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(234, 76, 137, 0.3);
        }
        .audio-control:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 35px rgba(234, 76, 137, 0.7);
            transform: scale(1.05);
        }

        /* Modern Glowing Typography */
        .title-container {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
            width: 100%;
        }
        h1 {
            color: #fff;
            font-size: 3.8rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            background: linear-gradient(45deg, #ff4e50, #f9d423, #e100ff, #00b8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(225, 0, 255, 0.4));
        }
        p {
            color: #dcbfff;
            font-size: 1.1rem;
            margin-top: 8px;
            letter-spacing: 3px;
        }

        /* Canvas Frame */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
        }
    </style>
</head>
<body>

    <button class="audio-control" id="audioBtn">🎵 Activate 8D Spatial Audio</button>
    <audio id="bgMusic" loop preload="auto">
        <source src="https://mixkit.co" type="audio/wav">
    </audio>

    <div class="title-container">
        <h1>Vibrant Bouquet</h1>
        <p>Move mouse to explore live 3D depth</p>
    </div>

    <!-- The 3D Render Screen -->
    <canvas id="bouquetCanvas"></canvas>

    <script>
        const canvas = document.getElementById('bouquetCanvas');
        const ctx = canvas.getContext('2d');
        const audioBtn = document.getElementById('audioBtn');
        const bgMusic = document.getElementById('bgMusic');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let mouseX = 0, mouseY = 0;

        // 8D Audio Logic
        let audioContext, panner, source;
        audioBtn.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
                audioBtn.innerText = "⏸️ Pause Audio";
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    source = audioContext.createMediaElementSource(bgMusic);
                    panner = audioContext.createPanner();
                    panner.panningModel = 'HRTF';
                    source.connect(panner);
                    panner.connect(audioContext.destination);
                }
            } else {
                bgMusic.pause();
                audioBtn.innerText = "🎵 Activate 8D Spatial Audio";
            }
        });

        // 5 Real High-Quality HD Transparent Flower Image URLs
        const flowerImagesSrc = [
            'https://ibb.co', // Premium Pink Rose
            'https://ibb.co', // Vibrant Orchid
            'https://ibb.co', // Exotic Red Blossom
            'https://ibb.co', // Bright Sunflower Lily
            'https://ibb.co'  // Soft Pastel Peony
        ];

        // Preload Images to prevent flickering
        const loadedImages = [];
        let imagesLoadedCount = 0;

        flowerImagesSrc.forEach((src) => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = src;
            img.onload = () => {
                loadedImages.push(img);
                imagesLoadedCount++;
                if (imagesLoadedCount === flowerImagesSrc.length) {
                    // Start rendering only after all real images are ready
                    initBouquet();
                }
            };
        });

        class RealFlowerParticle {
            constructor() {
                this.reset();
                this.y = Math.random() * height; // Distribute over screen on first load
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 200 + 50; // Come from bottom
                this.z = Math.random() * 400 + 100; // Realistic depth layer
                this.baseSize = Math.random() * 60 + 50; // Bigger sizing for real look
                this.speedY = Math.random() * 1.2 + 0.6; // Gentle smooth float
                this.speedX = Math.random() * 0.8 - 0.4;
                this.spin = Math.random() * 0.015 - 0.0075; // Natural swaying motion
                this.angle = Math.random() * Math.PI * 2;
                
                // Assign a random real image from preloaded array
                this.img = loadedImages[Math.floor(Math.random() * loadedImages.length)];
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.angle += this.spin;
                this.z -= 0.25; // Continuous forward motion illusion

                if (this.y < -150 || this.z <= 40) {
                    this.reset();
                }
            }

            draw() {
                if (!this.img) return;

                // Matrix 3D Depth Math Formula
                const focalLength = 300;
                const scale = focalLength / (focalLength + this.z);
                
                // Immersive Parallax responsive calculation
                const projX = (this.x - width / 2) * scale + width / 2 + (mouseX * (600 / this.z));
                const projY = (this.y - height / 2) * scale + height / 2 + (mouseY * (600 / this.z));
                const finalSize = this.baseSize * scale * 2.5;

                ctx.save();
                ctx.translate(projX, projY);
                ctx.rotate(this.angle);

                // Beautiful fade configuration for realism
                ctx.globalAlpha = Math.min(1, (500 - this.z) / 250);

                // Shadow for 3D POP effect over background
                ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 10;

                // Draw the Real Flower Asset
                ctx.drawImage(this.img, -finalSize / 2, -finalSize / 2, finalSize, finalSize);

                ctx.restore();
            }
        }

        const bouquetList = [];
        const maxFlowers = 45; // Perfect balance for density and smooth performance

        function initBouquet() {
            for (let i = 0; i < maxFlowers; i++) {
                bouquetList.push(new RealFlowerParticle());
            }
            animateLoop();
        }

        // Capture Mouse Depth Coordinates
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - width / 2) / (width / 2) * 35;
            mouseY = (e.clientY - height / 2) / (height / 2) * 35;

            // Pan audio left/right dynamically
            if (panner && audioContext) {
                panner.positionX.setValueAtTime(mouseX / 8, audioContext.currentTime);
            }
        });

        function animateLoop() {
            ctx.clearRect(0, 0, width, height);

            // Z-Sorting (Peeche wale flower pehle, paas wale flower upar render honge)
            bouquetList.sort((a, b) => b.z - a.z);

            bouquetList.forEach(flower => {
                flower.update();
                flower.draw();
            });

            requestAnimationFrame(animateLoop);
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
