<!DOCTYPE html>
<html>
<head>
    <title>TechFarm Admin Dashboard</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            padding:20px;
            background:#f5f5f5;
        }

        h1{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th, td{
            border:1px solid #ddd;
            padding:10px;
            text-align:left;
        }

        th{
            background:#2563eb;
            color:white;
        }

        img{
            width:100px;
            height:100px;
            object-fit:cover;
            border-radius:8px;
        }

    </style>

</head>

<body>

<h1>Location Tracking Dashboard</h1>

<table id="recordsTable">

    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
             <th>Photo</th>
            <th>Latitude</th>
            <th>Longitude</th>
            <th>Address</th>
            <th>Date</th>
        </tr>
    </thead>

    <tbody>
    </tbody>

</table>
<script>

fetch("/admin-locations")

.then(response => response.json())

.then(data => {

    console.log(data);

    const tbody = document.querySelector("#recordsTable tbody");

    tbody.innerHTML = "";

    data.forEach(record => {

        const row = document.createElement("tr");

        row.innerHTML = `
    <td>${record.id}</td>
    <td>${record.name}</td>
    <td>${record.phone}</td>
    <td><img src="${record.photo}" alt="User Photo"></td>
    <td>${record.latitude}</td>
    <td>${record.longitude}</td>
    <td>${record.address}</td>
    <td>${record.created_at}</td>
`;

        tbody.appendChild(row);

    });

})

.catch(error => {

    console.error("Error:", error);

});

</script>


</body>
</html>
